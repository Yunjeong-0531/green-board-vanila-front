<!DOCTYPE html>
<html>
    <head>
       <meta charset="UTF-8">
       <title>상세페이지</title>
       <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
         <script src="https://kit.fontawesome.com/096dd49feb.js" crossorigin="anonymous"></script>
        <script defer src="js/api.js"></script> 
        <script defer src="js/auth.js"></script> 

         <script defer src="js/render.js"></script>  
         <script defer src="js/detail.js"></script> 
          <script defer src="js/edit.js"></script> 
        
     
    </head>
    <body>
        <header>
            <!-- 헤더 영역 -->
            <a class="brand" href="index.html">게시판</a>
            <nav>
                <a href="index.html">게시판</a>
                <a class="write-link" href="write.html">글쓰기</a>
                <a class="login-link" href="login.html">로그인</a>
                 <a class="info-link" href="info.html">내정보</a>
                <button class="logout-button" type="button">로그아웃</button>
            </nav>
        </header>
        <main>
            <article>
                <span id="menu-toggle" aria-label="메뉴">
                    <i class="fa-solid fa-gear"></i>
                </span>
                <div class="menu-box" id="menu-box" hidden>
                    <button type ="button" id="edit-btn">수정</button>
                    <button type="button" id="delete-btn"> 삭제</button>
                </div>
                <h1 id="post-title"></h1>
                
                <p id="post-meta" class="meta"></p>
                <p id="post-content"></p>
                <p id="post-message"></p>
            </article>
            <a href="index.html">목록으로</a>
            <section id="comments-section">
                <h2>댓글</h2>
                <!-- 댓글 목록 영역 -->
                 <p id="comment-message"></p>   
                <ul id="comment-list"></ul>         
                
                </ul>
                <!-- 댓글 입력창 -->
                <form id="comment-form">
                    <label>댓글 내용</label>
                    <textarea id="comment-content" name="content" required></textarea>
                  
                    <button type="submit">댓글 등록</button>
                </form>
            </section>
        </main>
        <footer>
            게시판 실습
        </footer>
    </body>
</html>
